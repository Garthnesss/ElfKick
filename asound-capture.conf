# ElfKick test config: like asound-null.conf but captures the engine's
# output PCM to /tmp/rig-capture.raw (raw interleaved, format as
# negotiated by the app) via the ALSA file plugin over a null slave.
pcm.!default {
    type file
    slave.pcm "nullslave"
    file "/tmp/rig-capture.raw"
    format "raw"
}
pcm.nullslave { type null }
ctl.!default { type null }
