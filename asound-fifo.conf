# ElfKick test config: engine output via ALSA file plugin into a FIFO;
# a throttled reader (scripts/rig_capture_reader.py) paces the engine
# and lands the PCM at ~/workspace/elfkick/rig-capture.raw.
pcm.!default {
    type file
    slave.pcm "nullslave"
    file "/tmp/rig.fifo"
    format "raw"
}
pcm.nullslave { type null }
ctl.!default { type null }
